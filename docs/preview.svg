<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Three original theme palette concepts: warm, forest and night">
  <defs>
    <linearGradient id="warm" x2="1" y2="1"><stop stop-color="#fff7e6"/><stop offset="1" stop-color="#d8aa71"/></linearGradient>
    <linearGradient id="forest" x2="1" y2="1"><stop stop-color="#e9f7ed"/><stop offset="1" stop-color="#7fab92"/></linearGradient>
    <linearGradient id="night" x2="1" y2="1"><stop stop-color="#111a30"/><stop offset="1" stop-color="#416189"/></linearGradient>
  </defs>
  <rect width="1200" height="480" rx="24" fill="#f6f5f2"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="40" y="53" font-size="25" font-weight="600" fill="#26332c">Your picture. A calmer workspace.</text>
    <text x="40" y="82" font-size="15" fill="#65726a">Three starting palettes · readable surfaces · normal body weight</text>
    <g transform="translate(40,110)">
      <rect width="360" height="300" rx="20" fill="url(#warm)"/>
      <path d="M0 250 Q130 110 360 205 V300 H0Z" fill="#bb8b4e" opacity=".23"/>
      <rect x="18" y="22" width="75" height="256" rx="12" fill="#fff9ef" opacity=".6"/>
      <rect x="108" y="74" width="230" height="110" rx="12" fill="#fff9ef" opacity=".91"/>
      <rect x="108" y="202" width="230" height="64" rx="12" fill="#fff9ef" opacity=".95"/>
      <text x="126" y="110" fill="#302a24" font-size="18">Warm / 暖光</text>
      <text x="126" y="141" fill="#655749" font-size="14">柔和、通透、正文清楚</text>
      <text x="126" y="239" fill="#81572a" font-size="14">写下你的想法…</text>
    </g>
    <g transform="translate(420,110)">
      <rect width="360" height="300" rx="20" fill="url(#forest)"/>
      <path d="M0 250 Q130 110 360 205 V300 H0Z" fill="#246349" opacity=".22"/>
      <rect x="18" y="22" width="75" height="256" rx="12" fill="#f3faf6" opacity=".6"/>
      <rect x="108" y="74" width="230" height="110" rx="12" fill="#f3faf6" opacity=".91"/>
      <rect x="108" y="202" width="230" height="64" rx="12" fill="#f3faf6" opacity=".95"/>
      <text x="126" y="110" fill="#18362b" font-size="18">Forest / 森林</text>
      <text x="126" y="141" fill="#426354" font-size="14">自然的绿，安静的画面</text>
      <text x="126" y="239" fill="#236249" font-size="14">写下你的想法…</text>
    </g>
    <g transform="translate(800,110)">
      <rect width="360" height="300" rx="20" fill="url(#night)"/>
      <path d="M0 250 Q130 110 360 205 V300 H0Z" fill="#9cc9ff" opacity=".13"/>
      <rect x="18" y="22" width="75" height="256" rx="12" fill="#172338" opacity=".7"/>
      <rect x="108" y="74" width="230" height="110" rx="12" fill="#172338" opacity=".94"/>
      <rect x="108" y="202" width="230" height="64" rx="12" fill="#172338" opacity=".97"/>
      <text x="126" y="110" fill="#eef4ff" font-size="18">Night / 夜色</text>
      <text x="126" y="141" fill="#b6c5d9" font-size="14">深色背景，清晰层次</text>
      <text x="126" y="239" fill="#9cc9ff" font-size="14">写下你的想法…</text>
    </g>
    <text x="40" y="449" font-size="14" fill="#65726a">Palette concept illustration — not a live Codex screenshot.</text>
  </g>
</svg>
